name: Build and Release Rooler

on:
  push:
    tags:
      - '*'

  workflow_dispatch:
    inputs:
      tag:
        description: 'Укажите тег для релиза (например, v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release
        working-directory: src
        shell: pwsh
        run: |
          # Подключаем пакет заголовков .NET Framework на лету
          @"
          <Project>
            <ItemGroup>
              <PackageReference Include="Microsoft.NETFramework.ReferenceAssemblies" Version="1.0.3" PrivateAssets="All" />
            </ItemGroup>
          </Project>
          "@ | Set-Content -Path Directory.Build.props

          # Собираем проект (флаг /restore скачает заголовки для нужного таргета)
          msbuild Rooler.sln /restore /m /p:Configuration=Release /p:DebugType=none /p:DebugSymbols=false /p:OutDir=../dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Rooler ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/Rooler.exe
