name: Build and Release Rooler

on:
  push:
    tags:
      - '*'

  workflow_dispatch:
    inputs:
      tag:
        description: 'Укажите тег для релиза (например, v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release
        working-directory: src
        shell: pwsh
        run: |
          @"
          <Project>
            <ItemGroup>
              <PackageReference Include="Microsoft.NETFramework.ReferenceAssemblies" Version="1.0.3" PrivateAssets="All" />
            </ItemGroup>
          </Project>
          "@ | Set-Content -Path Directory.Build.props

          # 1. Скачиваем заголовки .NET Framework 4.5.2
          msbuild Rooler.sln /t:Restore /p:Configuration=Release

          # 2. Находим скачанный корень заголовков и передаем его явно (чтобы увидел и *_wpftmp.csproj)
          $v452 = Get-ChildItem "$env:USERPROFILE\.nuget\packages\microsoft.netframework.referenceassemblies.net452" -Filter "v4.5.2" -Recurse -Directory | Select-Object -First 1
          if (-not $v452) { throw "ReferenceAssemblies v4.5.2 не найдены!" }
          $rootPath = $v452.Parent.Parent.FullName + "\"

          # 3. Собираем проект
          msbuild Rooler.sln /m /p:Configuration=Release /p:DebugType=none /p:DebugSymbols=false /p:OutDir=../dist/ /p:TargetFrameworkRootPath="$rootPath" /p:BypassFrameworkInstallChecks=true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Rooler ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/Rooler.exe
